name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: syntax and lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      # Syntax errors, undefined names and invalid comparisons only.
      # Tighten the rule set once the existing warnings are cleaned up.
      - name: Lint
        run: ruff check --select E9,F63,F7,F82 --output-format=github .

      - name: Compile all modules
        run: python -m compileall -q app modules
